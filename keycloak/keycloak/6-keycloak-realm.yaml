---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: rhdh-realm
  namespace: demo-project
spec:
  keycloakCRName: demo-keycloak-instance
  realm:
    id: rhdh
    realm: rhdh
    displayName: "RHDH Realm"
    enabled: true
    browserFlow: browser
    identityProviders:
      - alias: github
        displayName: "GitHub"
        providerId: github
        enabled: true
        trustEmail: true
        storeToken: false
        addReadTokenRoleOnCreate: false
        authenticateByDefault: false
        linkOnly: false
        firstBrokerLoginFlowAlias: first broker login
        config:
          clientId: "Ov23likPVgYpwDUNEVt5"
          clientSecret: "6cbec0d7211c1aba27ae500dc726f9b7ab2c079c"
          defaultScope: "user:email"
    clients:
      - clientId: rhdh
        name: rhdh
        description: Red Hat Developer Hub Client
        enabled: true
        protocol: openid-connect
        publicClient: false
        redirectUris:
          - "https://rhdh.apps.cluster-db131a98-9636-4a3d-a6a2-2d2e6482e986.apps.ocp-knowitno.cncs.dk/api/auth/*"
        rootUrl: "https://rhdh.apps.cluster-db131a98-9636-4a3d-a6a2-2d2e6482e986.apps.ocp-knowitno.cncs.dk"
        adminUrl: "https://rhdh.apps.cluster-db131a98-9636-4a3d-a6a2-2d2e6482e986.apps.ocp-knowitno.cncs.dk"
        baseUrl: "https://rhdh.apps.cluster-db131a98-9636-4a3d-a6a2-2d2e6482e986.apps.ocp-knowitno.cncs.dk"
        webOrigins:
          - "+"
        secret: "developer-hub-secret"
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        authorizationServicesEnabled: false
...
